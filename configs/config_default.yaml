model:
    smi_model_card: "DeepChem/ChemBERTa-77M-MTR"
    prot_model_card: "facebook/esm2_t33_650M_UR50D"
    combine:
        mlp_hidden_dim: 512
        full_smiles_sequence: True
        smiles_hidden_dim: 256
        num_heads: 8
        comb_dropout: 0.1
        no_cross_attn: False
        no_prot_model_ft: True
        lin_proj: False
        use_binding_mask: True

    lora_module:
        inference_mode: False
        r: 8
        lora_alpha: 8
        bias: "none"
        use_rslora: False
        modules_to_save: ["pooler.dense.bias", "pooler.dense.weight"]
        target_modules: ["query", "key", "value"]
        lora_dropout: 0.1

training:
    seed: 63           # base RNG seed; each split uses seed + split_index
    deterministic: True # pin cuDNN/cuBLAS + deterministic algorithms (minor perf cost)
    data_path: "data/CC/LORO2/"
    save_path: "results/CC_AgOr1_splot"

train_lorax:
    batch_size: 12
    val_batch_size: 110
    lr: 0.00001  # NOTE
    train_epochs: 50
train_GB:
    max_evals: 500
    use_lorax_embs: False
